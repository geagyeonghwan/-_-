<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사다리타기</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #2b2f38;
    --accent: #4f7cff;
    --accent2: #ff6b6b;
    --text: #1c1e21;
    --muted: #767b86;
    --border: #e2e4e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1e2127;
      --line: #c8ccd4;
      --accent: #6d8bff;
      --accent2: #ff8787;
      --text: #eceef2;
      --muted: #9aa0ab;
      --border: #30333b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 4px;
  }
  .sub {
    text-align: center;
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .row label { width: 80px; color: var(--muted); font-size: 14px; flex-shrink: 0; }
  .count-control { display: flex; align-items: center; gap: 8px; }
  .count-control button {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
  }
  .count-control span { min-width: 24px; text-align: center; font-weight: 600; }
  .names-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
    margin-bottom: 12px;
  }
  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-group span.label { font-size: 12px; color: var(--muted); }
  input[type="text"] {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.action {
    flex: 1;
    min-width: 120px;
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button.action:active { transform: scale(0.97); }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border) !important; }
  .canvas-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 8px;
    overflow-x: auto;
  }
  canvas { display: block; margin: 0 auto; cursor: default; }
  #resultPanel {
    margin-top: 16px;
  }
  .result-line {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    font-size: 14px;
    opacity: 0;
    transform: translateY(4px);
    animation: fadeIn 0.3s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  .result-line b { color: var(--accent); }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🪜 사다리타기</h1>
  <div class="sub">참가자와 결과를 입력하고 사다리를 타 보세요</div>

  <div class="panel">
    <div class="row">
      <label>참가자 수</label>
      <div class="count-control">
        <button id="decBtn" type="button">−</button>
        <span id="countLabel">4</span>
        <button id="incBtn" type="button">+</button>
      </div>
    </div>
    <div id="namesArea" class="names-grid"></div>
    <div class="btn-row">
      <button class="action btn-primary" id="buildBtn">사다리 만들기</button>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="ladderCanvas"></canvas>
  </div>
  <div class="hint">위쪽 이름을 클릭하면 경로를 따라가며 결과를 보여줍니다</div>

  <div class="btn-row">
    <button class="action btn-secondary" id="rerollBtn" disabled>사다리 다시 그리기</button>
    <button class="action btn-primary" id="revealAllBtn" disabled>전체 결과 보기</button>
  </div>

  <div id="resultPanel"></div>
</div>

<script>
(function () {
  const namesArea = document.getElementById('namesArea');
  const countLabel = document.getElementById('countLabel');
  const decBtn = document.getElementById('decBtn');
  const incBtn = document.getElementById('incBtn');
  const buildBtn = document.getElementById('buildBtn');
  const rerollBtn = document.getElementById('rerollBtn');
  const revealAllBtn = document.getElementById('revealAllBtn');
  const canvas = document.getElementById('ladderCanvas');
  const ctx = canvas.getContext('2d');
  const resultPanel = document.getElementById('resultPanel');

  const MIN_N = 2;
  const MAX_N = 8;
  let n = 4;

  const colColors = ['#4f7cff', '#ff6b6b', '#2bb673', '#ffb020', '#a56dff', '#00b8d9', '#ff5fa2', '#7c8b9c'];

  let ladder = null;
  let animating = false;
  let colX = [];
  let rowY = [];
  let canvasWidth = 0;
  let canvasHeight = 0;
  const topGap = 60;
  const bottomGap = 60;
  const sideGap = 40;
  let rowCount = 18;
  let rowHeight = 26;

  function renderInputs() {
    namesArea.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const nameGroup = document.createElement('div');
      nameGroup.className = 'field-group';
      nameGroup.innerHTML = `
        <span class="label">참가자 ${i + 1}</span>
        <input type="text" id="name-${i}" placeholder="이름" value="참가자${i + 1}">
      `;
      const resultGroup = document.createElement('div');
      resultGroup.className = 'field-group';
      resultGroup.innerHTML = `
        <span class="label">결과 ${i + 1}</span>
        <input type="text" id="result-${i}" placeholder="결과" value="꽝">
      `;
      namesArea.appendChild(nameGroup);
      namesArea.appendChild(resultGroup);
    }
    countLabel.textContent = n;
  }

  decBtn.addEventListener('click', () => {
    if (n > MIN_N) { n--; renderInputs(); }
  });
  incBtn.addEventListener('click', () => {
    if (n < MAX_N) { n++; renderInputs(); }
  });

  function getNames() {
    const names = [];
    for (let i = 0; i < n; i++) names.push(document.getElementById(`name-${i}`).value.trim() || `참가자${i + 1}`);
    return names;
  }
  function getResults() {
    const results = [];
    for (let i = 0; i < n; i++) results.push(document.getElementById(`result-${i}`).value.trim() || `결과${i + 1}`);
    return results;
  }

  function generateLadder() {
    const rungs = [];
    for (let r = 0; r < rowCount; r++) {
      const rowRungs = [];
      let c = 0;
      while (c < n - 1) {
        if (Math.random() < 0.35) {
          rowRungs.push(c);
          c += 2;
        } else {
          c += 1;
        }
      }
      rungs.push(rowRungs);
    }
    return { n, rungs };
  }

  function traceFromTop(startCol, rungs) {
    let col = startCol;
    const path = [{ row: 0, col }];
    for (let r = 0; r < rungs.length; r++) {
      const rowRungs = rungs[r];
      if (rowRungs.includes(col)) {
        col = col + 1;
      } else if (rowRungs.includes(col - 1)) {
        col = col - 1;
      }
      path.push({ row: r + 1, col });
    }
    return { endCol: col, path };
  }

  function layout() {
    const width = Math.max(360, n * 90);
    const height = topGap + bottomGap + rowCount * rowHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    colX = [];
    const usableWidth = width - sideGap * 2;
    for (let i = 0; i < n; i++) {
      colX.push(sideGap + (n === 1 ? usableWidth / 2 : (usableWidth * i) / (n - 1)));
    }
    rowY = [];
    for (let r = 0; r <= rowCount; r++) {
      rowY.push(topGap + r * rowHeight);
    }
    canvasWidth = width;
    canvasHeight = height;
    return { width, height };
  }

  function draw(highlightPaths) {
    layout();
    renderScene(highlightPaths);
  }

  function renderScene(highlightPaths) {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const lineColor = isDark ? '#c8ccd4' : '#2b2f38';
    ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    ctx.lineWidth = 2;
    ctx.strokeStyle = lineColor;
    ctx.font = '600 14px sans-serif';
    ctx.textAlign = 'center';

    const names = getNames();
    const results = getResults();

    for (let i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.moveTo(colX[i], rowY[0]);
      ctx.lineTo(colX[i], rowY[rowCount]);
      ctx.stroke();
    }

    ctx.strokeStyle = lineColor;
    ladder.rungs.forEach((rowRungs, r) => {
      rowRungs.forEach((c) => {
        ctx.beginPath();
        ctx.moveTo(colX[c], rowY[r]);
        ctx.lineTo(colX[c + 1], rowY[r]);
        ctx.stroke();
      });
    });

    if (highlightPaths) {
      highlightPaths.forEach(({ path, color }) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        path.forEach((p, idx) => {
          const x = colX[p.col];
          const y = rowY[p.row];
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });
    }

    ctx.fillStyle = isDark ? '#eceef2' : '#1c1e21';
    for (let i = 0; i < n; i++) {
      ctx.fillText(names[i], colX[i], rowY[0] - 20);
      ctx.fillText(results[i], colX[i], rowY[rowCount] + 34);
    }
  }

  function animatePath(startCol, onDone) {
    const { endCol, path } = traceFromTop(startCol, ladder.rungs);
    const color = colColors[startCol % colColors.length];
    const totalSegments = path.length - 1;
    const duration = Math.max(500, totalSegments * 45);
    const startTime = performance.now();

    function frame(now) {
      try {
        const t = Math.min(1, (now - startTime) / duration);
        const progress = t * totalSegments;
        const fullIdx = Math.floor(progress);
        const frac = progress - fullIdx;

        const points = path.slice(0, fullIdx + 1).map((p) => ({ x: colX[p.col], y: rowY[p.row] }));
        if (fullIdx < totalSegments) {
          const p1 = path[fullIdx];
          const p2 = path[fullIdx + 1];
          const x1 = colX[p1.col], y1 = rowY[p1.row];
          const x2 = colX[p2.col], y2 = rowY[p2.row];
          points.push({ x: x1 + (x2 - x1) * frac, y: y1 + (y2 - y1) * frac });
        }

        renderScene(null);
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        points.forEach((p, idx) => {
          if (idx === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          onDone(endCol);
        }
      } catch (err) {
        console.error('사다리 애니메이션 오류:', err);
        onDone(endCol);
      }
    }
    layout();
    requestAnimationFrame(frame);
  }

  function setControlsDisabled(disabled) {
    buildBtn.disabled = disabled;
    rerollBtn.disabled = disabled || !ladder;
    revealAllBtn.disabled = disabled || !ladder;
  }

  function onCanvasClick(evt) {
    if (!ladder || animating) return;
    const rect = canvas.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const y = evt.clientY - rect.top;
    if (y > 40) return;
    let closest = 0;
    let minDist = Infinity;
    colX.forEach((cx, i) => {
      const d = Math.abs(cx - x);
      if (d < minDist) { minDist = d; closest = i; }
    });
    if (minDist > 40) return;

    animating = true;
    setControlsDisabled(true);
    resultPanel.innerHTML = '';
    animatePath(closest, (endCol) => {
      animating = false;
      setControlsDisabled(false);
      const names = getNames();
      const results = getResults();
      const line = document.createElement('div');
      line.className = 'result-line';
      line.innerHTML = `<span>${names[closest]}</span><b>${results[endCol]}</b>`;
      resultPanel.appendChild(line);
    });
  }

  function revealAll() {
    if (!ladder) return;
    const names = getNames();
    const results = getResults();
    const paths = [];
    resultPanel.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const { endCol, path } = traceFromTop(i, ladder.rungs);
      paths.push({ path, color: colColors[i % colColors.length] });
      const line = document.createElement('div');
      line.className = 'result-line';
      line.style.animationDelay = (i * 0.06) + 's';
      line.innerHTML = `<span style="color:${colColors[i % colColors.length]}">${names[i]}</span><b>${results[endCol]}</b>`;
      resultPanel.appendChild(line);
    }
    draw(paths);
  }

  function buildLadder() {
    ladder = generateLadder();
    layout();
    draw(null);
    resultPanel.innerHTML = '';
    rerollBtn.disabled = false;
    revealAllBtn.disabled = false;
  }

  buildBtn.addEventListener('click', buildLadder);
  rerollBtn.addEventListener('click', buildLadder);
  revealAllBtn.addEventListener('click', revealAll);
  canvas.addEventListener('click', onCanvasClick);

  renderInputs();
  layout();
})();
</script>
</body>
</html>
