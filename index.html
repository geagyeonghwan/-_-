<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신청 폼</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --accent: #4f7cff;
    --text: #1c1e21;
    --muted: #767b86;
    --border: #e2e4e9;
    --error: #ff6b6b;
    --success: #2bb673;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1e2127;
      --accent: #6d8bff;
      --text: #eceef2;
      --muted: #9aa0ab;
      --border: #30333b;
      --error: #ff8787;
      --success: #3ecf8e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 420px; }
  h1 { text-align: center; font-size: 24px; margin-bottom: 4px; }
  .sub { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .field { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; color: var(--muted); }
  input {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }
  input:focus { outline: 2px solid var(--accent); }
  .error-text { color: var(--error); font-size: 12px; min-height: 16px; }
  button {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { text-align: center; margin-top: 16px; font-size: 14px; display: none; }
  .status.success { color: var(--success); display: block; }
  .status.fail { color: var(--error); display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>신청 폼</h1>
  <div class="sub">이름, 이메일, 전화번호를 입력해 주세요</div>

  <form id="contactForm">
    <div class="field">
      <label for="name">이름</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="phone">전화번호</label>
      <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required>
      <div class="error-text" id="phoneError"></div>
    </div>
    <button type="submit" id="submitBtn">제출하기</button>
    <div class="status" id="status"></div>
  </form>
</div>

<script>
(function () {
  const FORM_ENDPOINT = 'https://formspree.io/f/xdenorzj';
  const form = document.getElementById('contactForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const phoneInput = document.getElementById('phone');
  const phoneError = document.getElementById('phoneError');
  const phonePattern = /^[0-9\-+ ]{7,20}$/;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    phoneError.textContent = '';
    if (!phonePattern.test(phoneInput.value.trim())) {
      phoneError.textContent = '전화번호 형식을 확인해 주세요';
      phoneInput.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '제출 중...';
    statusEl.className = 'status';
    statusEl.textContent = '';

    try {
      const res = await fetch(FORM_ENDPOINT, {
        method: 'POST',
        headers: { Accept: 'application/json' },
        body: new FormData(form),
      });
      if (res.ok) {
        statusEl.className = 'status success';
        statusEl.textContent = '제출되었습니다. 감사합니다!';
        form.reset();
      } else {
        statusEl.className = 'status fail';
        statusEl.textContent = '제출에 실패했습니다. 잠시 후 다시 시도해 주세요.';
      }
    } catch (err) {
      statusEl.className = 'status fail';
      statusEl.textContent = '네트워크 오류로 제출하지 못했습니다.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '제출하기';
    }
  });
})();
</script>
</body>
</html>
